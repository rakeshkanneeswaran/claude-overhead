name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Run checks
        run: make check

      - name: Run tests
        run: make test

      - name: Draw every What's New
        # Each release's notes, drawn page by page by the app as built here,
        # so notes the What's New window cannot show never reach a release.
        run: |
          for notes in ReleaseNotes/*.json; do
            ./Scripts/check-release-notes.sh --render "$(basename "$notes" .json)"
          done
