name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Run checks
        run: make check

      - name: Run tests
        run: make test

      - name: Package the app and launch it
        # The app as a release packages it, started once on this clean
        # machine: it must stay running and its helper must reach it.
        # Releases are built on the maintainer's Mac, where the app cannot be
        # started without touching their own settings, so a build that cannot
        # launch is caught here. Scripts/public-release.sh publishes only a
        # commit this job passed.
        run: |
          CHIMLO_PACKAGE_VARIANT=release CHIMLO_CODE_SIGN_IDENTITY=- CHIMLO_ALLOW_ADHOC_RELEASE=1 ./Scripts/package-app.sh
          ./Scripts/smoke-launch.sh "dist/Claude Overhead.app"

      - name: Draw every What's New
        # Each release's notes, drawn page by page by the app as built here,
        # so notes the What's New window cannot show never reach a release.
        run: |
          for notes in ReleaseNotes/*.json; do
            ./Scripts/check-release-notes.sh --render "$(basename "$notes" .json)"
          done
