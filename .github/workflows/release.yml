name: Release DMG

# Pushing a version tag (git tag v1.2.3 && git push origin v1.2.3) builds the
# app, runs every check and test, verifies the DMG, and publishes it as the
# newest GitHub release. The stable link
#   https://github.com/rakeshkanneeswaran/claude-overhead/releases/latest/download/Claude-Overhead.dmg
# then serves it. The release only appears once its DMG is attached, so that
# link never points at a release without one.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild and republish (vX.Y.Z)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build, verify and publish the DMG
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: The tag matches the app's version
        run: |
          version="$(/usr/bin/plutil -extract CFBundleShortVersionString raw Packaging/Info.plist)"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match Packaging/Info.plist ($version)." >&2
            exit 1
          fi

      - name: Which checks this tag has
        # A tag is built with its own scripts. Only releases before 1.1.0
        # predate the launch check and What's New, and can still be rebuilt
        # without them; any later tag must have both.
        id: tag
        run: |
          if [ -e Scripts/check-release-notes.sh ] && [ -e Scripts/smoke-launch.sh ]; then
            echo "modern=true" >> "$GITHUB_OUTPUT"
          else
            case "$TAG" in
              v0.*|v1.0.*) echo "modern=false" >> "$GITHUB_OUTPUT" ;;
              *) echo "$TAG has no Scripts/check-release-notes.sh or Scripts/smoke-launch.sh." >&2; exit 1 ;;
            esac
          fi

      - name: What's New is ready for this version
        # Every release ships its own visual release notes. No notes for this
        # version, or notes that disagree with CHANGELOG.md, and nothing is
        # built or published (Docs/RELEASING.md).
        if: steps.tag.outputs.modern == 'true'
        run: ./Scripts/check-release-notes.sh --release "$TAG"

      - name: Checks
        run: make check

      - name: Tests
        run: make test

      - name: Build and verify the DMG
        run: ./Scripts/build-public-dmg.sh "$TAG" "${{ github.run_number }}"

      - name: Launch the packaged app
        # Everything above reads the bundle or tests the code as SwiftPM
        # builds it. This starts the app that is about to be published.
        if: steps.tag.outputs.modern == 'true'
        run: ./Scripts/smoke-launch.sh "dist/Claude Overhead.app"

      - name: The packaged app draws its What's New
        # The app about to be published must carry exactly this version's
        # notes, and its own What's New window must draw every page of them.
        if: steps.tag.outputs.modern == 'true'
        run: ./Scripts/check-release-notes.sh --release "$TAG" --app "dist/Claude Overhead.app"

      - name: Keep the What's New pages
        # Every page as the app drew it, to look at after the run.
        if: steps.tag.outputs.modern == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: whats-new-${{ env.TAG }}
          path: dist/whats-new/
          if-no-files-found: error

      - name: Sign the update feed
        # Installed copies update through Sparkle from this appcast.xml, and
        # accept only downloads signed with the key their SUPublicEDKey
        # matches. The private key lives only in this secret.
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "The SPARKLE_ED_PRIVATE_KEY secret is not set. Without a signed appcast.xml," >&2
            echo "installed copies could not update to $TAG, so nothing is published." >&2
            exit 1
          fi
          CHIMLO_RELEASE_TAG="$TAG" ./Scripts/generate-appcast.sh \
            "dist/public/Claude-Overhead-${TAG#v}.dmg" dist/public/appcast.xml

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          CHIMLO_REPLACE_ASSETS: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: ./Scripts/publish-github-release.sh "$TAG"
